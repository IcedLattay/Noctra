<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctra — Sleep better, nightly</title>
<style>
  :root { --bg:#0b0b14; --card:#141425; --border:#23233a; --accent:#6f5bff; --text:#eceaf6; --muted:#9a97b3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card {
    max-width:420px; width:100%; background:var(--card);
    border:1px solid var(--border); border-radius:20px;
    padding:44px 32px; text-align:center;
  }
  .moon { font-size:46px; }
  h1 { font-size:34px; margin:14px 0 8px; letter-spacing:.5px; }
  .tag { color:var(--muted); font-size:15px; line-height:1.55; margin-bottom:30px; }
  .btn {
    display:block; text-decoration:none; color:#fff; font-weight:600; font-size:16px;
    background:linear-gradient(135deg,var(--accent),#522abe);
    padding:15px 20px; border-radius:12px;
  }
  .btn:hover { filter:brightness(1.12); }
  .meta { color:var(--muted); font-size:13px; margin-top:14px; }
  footer { margin-top:28px; font-size:13px; color:var(--muted); }
  footer a { color:#9d8fff; }
</style>
</head>
<body>
  <main class="card">
    <div class="moon">&#127769;</div>
    <h1>Noctra</h1>
    <p class="tag">Your nightly companion for better sleep — structured routines, honest audits, and a little Shleepy to keep you on track.</p>
    <a class="btn" href="https://github.com/IcedLattay/Noctra/releases/download/v1.0/Noctra-1.0.apk">&#11015; Download for Android</a>
    <p class="meta">v1.0 &middot; 124 MB &middot; Free</p>
    <footer>Source on <a href="https://github.com/IcedLattay/Noctra">GitHub</a></footer>
  </main>
</body>
</html>
